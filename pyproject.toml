[project]
name = "pyrig-codecov"
version = "0.1.0"
description = "A pyrig plugin that integrates codecov."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyrig>=11.14.0",
]
license = "MIT"
license-files = [
    "LICENSE",
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = []

[[project.authors]]
name = "Winipedia"

[[project.maintainers]]
name = "Winipedia"

[project.urls]
Homepage = "https://github.com/Winipedia/pyrig-codecov"
Documentation = "https://Winipedia.github.io/pyrig-codecov"
Source = "https://github.com/Winipedia/pyrig-codecov"
Issues = "https://github.com/Winipedia/pyrig-codecov/issues"
Changelog = "https://github.com/Winipedia/pyrig-codecov/releases"

[project.scripts]
pyrig-codecov = "pyrig.rig.cli.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocstrings[python]>=1.0.4",
    "pip-audit>=2.10.0",
    "prek>=0.4.0",
    "pygithub>=2.9.1",
    "pyrig-dev>=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.13",
    "rumdl>=0.1.93",
    "ty>=0.0.36",
]

[build-system]
requires = [
    "uv_build",
]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "COM812",
    "ANN401",
]
fixable = [
    "ALL",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "--cov=pyrig_codecov --cov-report=term-missing --cov-fail-under=100"

[tool.bandit.assert_used]
skips = [
    "*/tests/*.py",
    "*/test_*/*.py",
]
